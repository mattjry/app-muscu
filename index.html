<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mon Suivi Muscu</title>
    <style>
        /* PALETTE SEAMLESS LIGHT (Inspirée de l'image) */
        :root {
            --bg-main: #FFFFFF;         /* Fond blanc pur */
            --text-primary: #1C1C1E;    /* Gris anthracite (presque noir) */
            --text-secondary: #8E8E93;  /* Gris moyen pour les infos secondaires */
            --accent: #0A1128;          /* Bleu nuit profond de la palette */
            --input-bg: #F2F2F7;        /* Gris très clair pour les zones de saisie */
            --divider: #E5E5EA;         /* Lignes de séparation ultra-fines */
            --danger: #FF3B30;
        }
        
        * { box-sizing: border-box; }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main); 
            margin: 0; 
            padding: 20px; 
            color: var(--text-primary); 
            padding-bottom: 100px; 
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, h4 { margin-top: 0; font-weight: 600; }
        
        /* TYPOGRAPHIE ÉPURÉE */
        .page-title {
            font-size: 32px;
            font-weight: 500;
            letter-spacing: -0.5px;
            margin-bottom: 30px;
            color: var(--text-primary);
        }
        .section-title {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 15px;
            color: var(--text-primary);
        }

        /* NAVIGATION SEAMLESS */
        .bottom-nav { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            display: flex; 
            padding-bottom: env(safe-area-inset-bottom);
            border-top: 1px solid var(--divider);
            z-index: 100;
        }
        .nav-item { 
            flex: 1; text-align: center; padding: 15px 0; font-size: 12px; font-weight: 600; 
            color: var(--text-secondary); cursor: pointer; transition: color 0.2s;
        }
        .nav-item.active { color: var(--accent); }
        
        .view { display: none; animation: fadeIn 0.2s ease-in-out; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* CONTENEURS INVISIBLES (Fini les boîtes) */
        .section-container { 
            margin-bottom: 30px; 
        }
        
        /* INPUTS FLAT */
        input, select, textarea { 
            width: 100%; padding: 16px; margin-top: 5px; margin-bottom: 15px; 
            border-radius: 12px; border: none; 
            background: var(--input-bg); color: var(--text-primary); 
            font-size: 16px; font-family: inherit;
            outline: none; -webkit-appearance: none;
        }
        input:focus, select:focus, textarea:focus { 
            background: #E8E8ED; 
        }
        
        /* BUTTONS ÉLÉGANTS */
        button { 
            background-color: var(--accent); color: white; border: none; font-weight: 600; 
            cursor: pointer; width: 100%; padding: 16px; border-radius: 12px; font-size: 16px;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.98); }
        .btn-secondary { background-color: var(--input-bg); color: var(--text-primary); }
        .btn-text { background: transparent; color: var(--accent); padding: 0; width: auto; font-size: 14px; font-weight: 500; }
        .btn-danger { background-color: transparent; color: var(--danger); border: 1px solid var(--danger); }
        .btn-small { padding: 8px 16px; font-size: 14px; width: auto; margin: 0; border-radius: 8px; }
        
        /* LISTES SANS BORDURES GLOBALES */
        ul { padding-left: 0; list-style: none; margin: 0; }
        li { 
            padding: 16px 0; 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid var(--divider); cursor: pointer;
        }
        li:last-child { border-bottom: none; }
        
        /* ACCORDÉON CATÉGORIES (Intégré au fond) */
        .category-header { 
            display: flex; align-items: center; font-size: 15px; font-weight: 600; 
            color: var(--text-primary); margin-top: 20px; padding-bottom: 10px; cursor: pointer; 
            border-bottom: 1px solid var(--text-primary);
        }
        .chevron { margin-right: 10px; font-size: 10px; transition: transform 0.2s; color: var(--text-secondary);}
        .chevron.closed { transform: rotate(-90deg); }
        .category-content { display: block; overflow: hidden; }
        .category-content.closed { display: none; }
        
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .flex-row { display: flex; gap: 10px; align-items: center; }

        /* SÉANCE ACTIVE */
        .set-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
        .set-row input { margin: 0; text-align: center; background: var(--input-bg); }
        .set-info { flex: 1; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 8px;}
        .last-perf { font-size: 13px; color: var(--text-secondary); margin-bottom: 10px; }
        .badge { background: var(--input-bg); color: var(--text-secondary); padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 600;}

        /* MODAL PLEIN ÉCRAN SEAMLESS */
        .modal-overlay { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: var(--bg-main); z-index: 200; overflow-y: auto; padding-bottom: 30px;
        }
        .modal-header { 
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); padding: 20px; 
            display: flex; justify-content: space-between; align-items: center; 
            position: sticky; top: 0; z-index: 201; border-bottom: 1px solid var(--divider);
        }
        .modal-body { padding: 20px; }
        
        /* GRAPHIQUE */
        .svg-container { width: 100%; height: 200px; margin-top: 10px; position: relative;}
    </style>
</head>
<body>

    <!-- VUE 1 : EXERCICES -->
    <div id="view-exercices" class="view">
        <h2 class="page-title">Exercices</h2>
        
        <div class="section-container">
            <input type="text" id="exerciseName" placeholder="Nouvel exercice (ex: Squat)">
            <div class="flex-row">
                <select id="exerciseCategory" style="margin-bottom: 0;">
                    <option value="Pectoraux">Pectoraux</option>
                    <option value="Dos">Dos</option>
                    <option value="Jambes">Jambes</option>
                    <option value="Épaules">Épaules</option>
                    <option value="Bras">Bras</option>
                    <option value="Abdos">Abdos</option>
                    <option value="Autre">Autre</option>
                </select>
                <button class="btn-small" style="padding: 16px 24px;" onclick="addExercise()">Créer</button>
            </div>
        </div>
        
        <div id="exerciseListArea" style="margin-bottom: 20px;"></div>
    </div>

    <!-- PAGE DÉTAILS DE L'EXERCICE (Modal) -->
    <div id="exerciseDetailModal" class="modal-overlay">
        <div class="modal-header">
            <button class="btn-text" onclick="closeExerciseDetail()">◀ Retour</button>
            <h3 class="section-title" style="margin: 0;">Détails</h3>
            <button class="btn-text" onclick="saveExerciseDetail()">Enregistrer</button>
        </div>
        <div class="modal-body">
            <div class="section-container">
                <label style="font-size: 13px; font-weight: 500; color: var(--text-secondary); display: block; margin-bottom: 5px;">NOM</label>
                <input type="text" id="detailExName">
                
                <label style="font-size: 13px; font-weight: 500; color: var(--text-secondary); display: block; margin-bottom: 5px;">CATÉGORIE</label>
                <select id="detailExCategory">
                    <option value="Pectoraux">Pectoraux</option>
                    <option value="Dos">Dos</option>
                    <option value="Jambes">Jambes</option>
                    <option value="Épaules">Épaules</option>
                    <option value="Bras">Bras</option>
                    <option value="Abdos">Abdos</option>
                    <option value="Autre">Autre</option>
                </select>

                <label style="font-size: 13px; font-weight: 500; color: var(--text-secondary); display: block; margin-bottom: 5px; margin-top: 10px;">NOTES / RÉGLAGES</label>
                <textarea id="detailExNotes" rows="3" placeholder="Ex: Siège sur 3..."></textarea>
            </div>

            <div class="section-container" style="margin-top: 30px;">
                <h3 class="section-title" style="margin-bottom: 5px;">Progression</h3>
                <p style="font-size: 13px; color: var(--text-secondary); margin-top: 0;">Charge maximale (kg)</p>
                <div class="svg-container" id="svgContainer">
                    <svg id="chartSvg" width="100%" height="100%"></svg>
                </div>
            </div>

            <button class="btn-danger" style="margin-top: 40px;" onclick="deleteCurrentExercise()">Supprimer l'exercice</button>
        </div>
    </div>

    <!-- VUE 2 : MES SÉANCES -->
    <div id="view-routines" class="view active">
        <h2 class="page-title">Séances</h2>
        
        <div id="routinesListArea">
            <button onclick="showRoutineBuilder()">+ Nouvelle Séance</button>
            <div id="routinesList" style="margin-top: 30px;"></div>
        </div>

        <!-- Constructeur de Séance -->
        <div id="routineBuilder" style="display: none;">
            <div class="section-container">
                <h3 id="builderTitle" class="section-title">Créer</h3>
                <input type="text" id="routineName" placeholder="Nom de la séance (ex: Push)">
                
                <label style="font-size: 13px; font-weight: 500; color: var(--text-secondary); display: block; margin-top: 20px; margin-bottom: 5px;">AJOUTER UN EXERCICE</label>
                <div class="flex-row">
                    <select id="routineExerciseSelect" style="margin-bottom: 0;"></select>
                    <button class="btn-secondary btn-small" style="padding: 16px 20px;" onclick="addExerciseToDraft()">Ajouter</button>
                </div>
            </div>
            
            <ul id="draftExerciseList" style="margin-bottom: 30px;"></ul>

            <div class="flex-row">
                <button class="btn-secondary" onclick="cancelRoutineBuilder()">Annuler</button>
                <button onclick="saveRoutine()">Enregistrer</button>
            </div>
        </div>
    </div>

    <!-- VUE 3 : ENTRAÎNEMENT ACTIF -->
    <div id="view-workout" class="view">
        <h2 id="activeWorkoutTitle" class="page-title" style="color: var(--accent);">En cours</h2>
        <div id="activeWorkoutContent"></div>
    </div>

    <!-- BARRE DE NAVIGATION EN BAS -->
    <div class="bottom-nav">
        <div class="nav-item" onclick="switchTab('exercices')">Exercices</div>
        <div class="nav-item active" onclick="switchTab('routines')">Séances</div>
        <div class="nav-item" onclick="switchTab('workout')" id="nav-workout" style="display:none; color: var(--accent);">En cours 🔴</div>
    </div>

    <script>
        let exercises = JSON.parse(localStorage.getItem('exercises')) || [];
        let routines = JSON.parse(localStorage.getItem('routines')) || [];
        let history = JSON.parse(localStorage.getItem('history')) || [];
        
        let draftRoutine = { name: "", items: [] }; 
        let editingRoutineId = null; 
        let currentWorkout = null; 
        let currentDetailExId = null;

        function init() { renderExercises(); renderRoutines(); populateExerciseSelects(); }

        function switchTab(tabName) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(v => v.classList.remove('active'));
            document.getElementById('view-' + tabName).classList.add('active');
            
            if(tabName === 'exercices') document.querySelectorAll('.nav-item')[0].classList.add('active');
            if(tabName === 'routines') document.querySelectorAll('.nav-item')[1].classList.add('active');
            if(tabName === 'workout') document.getElementById('nav-workout').classList.add('active');
        }

        function addExercise() {
            const name = document.getElementById('exerciseName').value.trim();
            const category = document.getElementById('exerciseCategory').value;
            if (name) {
                exercises.push({ id: Date.now().toString(), name: name, category: category, notes: "" });
                document.getElementById('exerciseName').value = "";
                saveData('exercises', exercises); renderExercises(); populateExerciseSelects();
            }
        }

        function toggleCategory(catId) {
            const content = document.getElementById(`cat-content-${catId}`);
            const chevron = document.getElementById(`chev-${catId}`);
            if (content.classList.contains('closed')) {
                content.classList.remove('closed'); chevron.classList.remove('closed');
            } else {
                content.classList.add('closed'); chevron.classList.add('closed');
            }
        }

        function renderExercises() {
            const area = document.getElementById('exerciseListArea'); area.innerHTML = "";
            const grouped = exercises.reduce((acc, ex) => {
                const cat = ex.category || "Autre"; 
                if (!acc[cat]) acc[cat] = []; acc[cat].push(ex); return acc;
            }, {});

            let catIndex = 0;
            for (const [cat, list] of Object.entries(grouped)) {
                html = `<div class="category-header" onclick="toggleCategory('${catIndex}')"><span class="chevron" id="chev-${catIndex}">▼</span> ${cat}</div><ul class="category-content" id="cat-content-${catIndex}">`;
                list.forEach(ex => {
                    html += `<li onclick="openExerciseDetail('${ex.id}')"><span>${ex.name}</span><span style="color:var(--text-secondary); font-size:18px;">›</span></li>`;
                });
                html += `</ul>`; area.innerHTML += html; catIndex++;
            }
        }

        function populateExerciseSelects() {
            const select = document.getElementById('routineExerciseSelect');
            select.innerHTML = '<option value="">-- Choisir --</option>';
            exercises.forEach(ex => { select.innerHTML += `<option value="${ex.id}">${ex.name}</option>`; });
        }

        function openExerciseDetail(id) {
            currentDetailExId = id; const ex = exercises.find(e => e.id === id);
            document.getElementById('detailExName').value = ex.name;
            document.getElementById('detailExCategory').value = ex.category || "Autre";
            document.getElementById('detailExNotes').value = ex.notes || "";
            document.getElementById('exerciseDetailModal').style.display = 'block';
            setTimeout(() => { renderChart(id); }, 10);
        }

        function saveExerciseDetail() {
            const ex = exercises.find(e => e.id === currentDetailExId);
            ex.name = document.getElementById('detailExName').value.trim();
            ex.category = document.getElementById('detailExCategory').value;
            ex.notes = document.getElementById('detailExNotes').value.trim();
            saveData('exercises', exercises); renderExercises(); populateExerciseSelects(); closeExerciseDetail();
        }

        function closeExerciseDetail() { document.getElementById('exerciseDetailModal').style.display = 'none'; currentDetailExId = null; }

        function deleteCurrentExercise() {
            if(confirm("Supprimer cet exercice ?")) {
                exercises = exercises.filter(ex => ex.id !== currentDetailExId);
                saveData('exercises', exercises); renderExercises(); populateExerciseSelects(); closeExerciseDetail();
            }
        }

        function renderChart(exId) {
            const svg = document.getElementById('chartSvg'); svg.innerHTML = ""; 
            let dataPoints = [];
            history.forEach(session => {
                const exItem = session.items.find(i => i.exId === exId);
                if (exItem && exItem.loggedSets) {
                    let maxWeight = Math.max(...exItem.loggedSets.map(s => parseFloat(s.weight) || 0));
                    if (maxWeight > 0) {
                        let d = new Date(session.date); dataPoints.push({ date: `${d.getDate()}/${d.getMonth()+1}`, weight: maxWeight });
                    }
                }
            });

            if (dataPoints.length === 0) {
                svg.innerHTML = `<text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-size="13" fill="var(--text-secondary)">Aucune donnée</text>`; return;
            }

            const width = document.getElementById('svgContainer').clientWidth;
            const height = 200; const padX = 20; const padY = 20;
            const maxW = Math.max(...dataPoints.map(d => d.weight)); const minW = Math.min(...dataPoints.map(d => d.weight));
            const rangeY = (maxW - minW) || 10; 

            let pointsSvg = ""; let circlesSvg = ""; let labelsSvg = "";
            
            // Grille légère
            svg.innerHTML += `<line x1="${padX}" y1="${height - padY}" x2="${width - padX}" y2="${height - padY}" stroke="var(--divider)" stroke-width="1" />`;

            dataPoints.forEach((pt, i) => {
                let cx = padX + (i * ((width - 2*padX) / Math.max(1, dataPoints.length - 1)));
                let cy = height - padY - ((pt.weight - minW) / rangeY) * (height - 2*padY);
                
                pointsSvg += `${cx},${cy} `;
                circlesSvg += `<circle cx="${cx}" cy="${cy}" r="5" fill="var(--bg-main)" stroke="var(--accent)" stroke-width="2" />`;
                labelsSvg += `<text x="${cx}" y="${height - 2}" font-size="11" text-anchor="middle" fill="var(--text-secondary)">${pt.date}</text>`;
                labelsSvg += `<text x="${cx}" y="${cy - 15}" font-size="12" font-weight="600" text-anchor="middle" fill="var(--text-primary)">${pt.weight}</text>`;
            });

            svg.innerHTML += `<polyline points="${pointsSvg.trim()}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>${circlesSvg}${labelsSvg}`;
        }

        function showRoutineBuilder(id = null) {
            document.getElementById('routinesListArea').style.display = 'none';
            document.getElementById('routineBuilder').style.display = 'block';
            if (id) {
                editingRoutineId = id; document.getElementById('builderTitle').innerText = "Modifier la séance";
                const routine = routines.find(r => r.id === id); draftRoutine = JSON.parse(JSON.stringify(routine)); 
                document.getElementById('routineName').value = draftRoutine.name;
            } else {
                editingRoutineId = null; document.getElementById('builderTitle').innerText = "Créer une séance";
                draftRoutine = { name: "", items: [] }; document.getElementById('routineName').value = "";
            }
            renderDraftList();
        }

        function cancelRoutineBuilder() { document.getElementById('routinesListArea').style.display = 'block'; document.getElementById('routineBuilder').style.display = 'none'; editingRoutineId = null; }

        function addExerciseToDraft() {
            const select = document.getElementById('routineExerciseSelect'); const exId = select.value;
            if (!exId) return; const exName = exercises.find(e => e.id === exId).name;
            draftRoutine.items.push({ exId: exId, exName: exName, sets: ["8-12"] }); renderDraftList(); select.value = "";
        }

        function moveExercise(index, direction) {
            if (index + direction < 0 || index + direction >= draftRoutine.items.length) return;
            const temp = draftRoutine.items[index]; draftRoutine.items[index] = draftRoutine.items[index + direction];
            draftRoutine.items[index + direction] = temp; renderDraftList();
        }

        function removeExerciseFromDraft(index) { draftRoutine.items.splice(index, 1); renderDraftList(); }
        function addSetToDraft(exIndex) { draftRoutine.items[exIndex].sets.push("8-12"); renderDraftList(); }
        function removeSetFromDraft(exIndex, setIndex) { draftRoutine.items[exIndex].sets.splice(setIndex, 1); renderDraftList(); }
        function updateDraftSetTarget(exIndex, setIndex, value) { draftRoutine.items[exIndex].sets[setIndex] = value; }

        function renderDraftList() {
            const list = document.getElementById('draftExerciseList'); list.innerHTML = "";
            draftRoutine.items.forEach((item, exIndex) => {
                let setsHtml = "";
                item.sets.forEach((target, setIndex) => {
                    setsHtml += `
                        <div class="flex-row" style="margin-top:10px;">
                            <span class="badge">S${setIndex + 1}</span>
                            <input type="text" style="margin:0;" value="${target}" onchange="updateDraftSetTarget(${exIndex}, ${setIndex}, this.value)" placeholder="Reps cibles">
                            <button class="btn-text" style="color:var(--text-secondary); width:auto;" onclick="removeSetFromDraft(${exIndex}, ${setIndex})">✕</button>
                        </div>
                    `;
                });
                list.innerHTML += `
                    <li style="display:block; padding: 20px 0;">
                        <div class="flex-between" style="margin-bottom: 15px;">
                            <strong style="font-size:16px;">${exIndex + 1}. ${item.exName}</strong>
                            <div class="flex-row" style="gap:5px;">
                                <button class="btn-text" style="color:var(--text-secondary);" onclick="moveExercise(${exIndex}, -1)">▲</button>
                                <button class="btn-text" style="color:var(--text-secondary);" onclick="moveExercise(${exIndex}, 1)">▼</button>
                                <button class="btn-text" style="color:var(--danger);" onclick="removeExerciseFromDraft(${exIndex})">✕</button>
                            </div>
                        </div>
                        <div>${setsHtml}</div>
                        <button class="btn-secondary" style="margin-top:15px;" onclick="addSetToDraft(${exIndex})">+ Ajouter une série</button>
                    </li>
                `;
            });
        }

        function saveRoutine() {
            const name = document.getElementById('routineName').value.trim();
            if (!name || draftRoutine.items.length === 0) return alert("Nom et exercices requis.");
            if (editingRoutineId) {
                const index = routines.findIndex(r => r.id === editingRoutineId);
                routines[index] = { id: editingRoutineId, name: name, items: draftRoutine.items };
            } else { routines.push({ id: Date.now().toString(), name: name, items: draftRoutine.items }); }
            saveData('routines', routines); cancelRoutineBuilder(); renderRoutines();
        }

        function deleteRoutine(id) {
            if(confirm("Supprimer cette séance ?")) { routines = routines.filter(r => r.id !== id); saveData('routines', routines); renderRoutines(); }
        }

        function renderRoutines() {
            const list = document.getElementById('routinesList'); list.innerHTML = "";
            routines.forEach(r => {
                list.innerHTML += `
                    <div style="padding: 20px 0; border-bottom: 1px solid var(--divider);">
                        <div class="flex-between" style="margin-bottom:10px;">
                            <h3 class="section-title" style="margin:0;">${r.name}</h3>
                            <button class="btn-text" onclick="showRoutineBuilder('${r.id}')">Modifier</button>
                        </div>
                        <div style="font-size:14px; color:var(--text-secondary); margin-bottom:20px; line-height:1.6;">
                            ${r.items.map(i => i.exName).join(' <span style="color:var(--divider);">|</span> ')}
                        </div>
                        <div class="flex-row">
                            <button onclick="startWorkout('${r.id}')">Commencer la séance</button>
                        </div>
                    </div>
                `;
            });
        }

        function startWorkout(routineId) {
            const routine = routines.find(r => r.id === routineId);
            currentWorkout = { routineId: routine.id, routineName: routine.name, date: new Date().toISOString(), items: JSON.parse(JSON.stringify(routine.items)) };
            document.getElementById('nav-workout').style.display = 'block';
            document.getElementById('activeWorkoutTitle').innerText = routine.name;
            renderActiveWorkout(); switchTab('workout');
        }

        function getLastSessionData(routineId) {
            const pastSessions = history.filter(h => h.routineId === routineId);
            return pastSessions.length === 0 ? null : pastSessions[pastSessions.length - 1]; 
        }

        function renderActiveWorkout() {
            const container = document.getElementById('activeWorkoutContent');
            const lastSession = getLastSessionData(currentWorkout.routineId);
            container.innerHTML = "";

            currentWorkout.items.forEach((item, exIndex) => {
                let html = `<div style="padding: 25px 0; border-bottom: 1px solid var(--divider);"><h3 class="section-title">${exIndex + 1}. ${item.exName}</h3>`;
                
                let lastItemData = null;
                if (lastSession && lastSession.items[exIndex] && lastSession.items[exIndex].exId === item.exId) { lastItemData = lastSession.items[exIndex]; }

                const baseEx = exercises.find(e => e.id === item.exId);
                if(baseEx && baseEx.notes) {
                    html += `<div style="font-size:13px; color:var(--text-primary); margin-bottom:20px; padding:12px; background:var(--input-bg); border-radius:8px;">${baseEx.notes}</div>`;
                }

                item.sets.forEach((targetReps, setIndex) => {
                    let lastPerfText = "—";
                    if (lastItemData && lastItemData.loggedSets && lastItemData.loggedSets[setIndex]) {
                        const l = lastItemData.loggedSets[setIndex]; lastPerfText = `${l.weight}kg × ${l.reps}`;
                    }

                    html += `
                        <div style="margin-top: 15px;">
                            <div class="flex-between" style="margin-bottom: 8px;">
                                <div class="set-info"><span class="badge">S${setIndex + 1}</span> <span style="font-size:13px; color:var(--text-secondary);">Cible: ${targetReps}</span></div>
                                <div class="last-perf">${lastPerfText}</div>
                            </div>
                            <div class="set-row">
                                <input type="number" id="w_${exIndex}_${setIndex}" placeholder="kg" inputmode="decimal">
                                <input type="number" id="r_${exIndex}_${setIndex}" placeholder="reps" inputmode="numeric">
                            </div>
                        </div>
                    `;
                });
                
                html += `</div>`; container.innerHTML += html;
            });

            container.innerHTML += `<button style="margin-top: 30px; margin-bottom: 40px;" onclick="finishWorkout()">Terminer la séance</button>`;
        }

        function finishWorkout() {
            currentWorkout.items.forEach((item, exIndex) => {
                item.loggedSets = [];
                item.sets.forEach((target, setIndex) => {
                    const weight = document.getElementById(`w_${exIndex}_${setIndex}`).value;
                    const reps = document.getElementById(`r_${exIndex}_${setIndex}`).value;
                    item.loggedSets.push({ weight: weight || 0, reps: reps || 0 });
                });
            });
            history.push(currentWorkout); saveData('history', history);
            currentWorkout = null; document.getElementById('nav-workout').style.display = 'none'; switchTab('routines');
        }

        function saveData(key, data) { localStorage.setItem(key, JSON.stringify(data)); }

        init();
    </script>
</body>
</html>
